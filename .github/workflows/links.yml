# Weekly check of external links in the content. Internal links are already
# verified by `vitepress build`, which fails on dead links.
name: Check external links

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-path .vitepress
            --exclude '^/'
            --exclude 'localhost'
            './src/**/*.md' './README*.md'
          fail: false

      - name: Open an issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken external links
          content-filepath: ./lychee/out.md
          labels: links
